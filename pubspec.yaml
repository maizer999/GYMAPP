name: stepz_pedometer
description: >
  Stepz-inspired pedometer & activity tracker — offline-first MVP built with
  Clean Architecture. Tracks daily steps in real time via hardware sensors,
  computes distance/calories offline, and persists history locally.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local persistence (fast time-series activity storage).
  # Upstream `isar`/`isar_flutter_libs` (3.1.x) are unmaintained and ship an
  # AndroidManifest `package=` attribute that AGP 8+ rejects outright. The
  # community fork keeps the same API (the library is still named `isar`
  # internally) but republishes the Android plugin with a modern manifest.
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  path_provider: ^2.1.3

  # Sensors & native health integration
  pedometer: ^4.0.2
  health: ^13.3.2
  permission_handler: ^11.3.1

  # UI & data visualization
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3

  # Utilities
  intl: ^0.20.2
  cupertino_icons: ^1.0.6

  # Splash
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  isar_community_generator: ^3.4.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/splash/splash.png

flutter_native_splash:
  color: "#0A1030"
  image: assets/icon/app_icon.png
  android_12:
    color: "#0A1030"
    image: assets/icon/app_icon.png
  web: false

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#0A1030"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0A1030"
    theme_color: "#0A1030"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
